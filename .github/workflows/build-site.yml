name: Build website

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: false
          packages: |
            any::knitr
            any::rmarkdown
            any::tibble
            any::dplyr
            any::magrittr
            any::glue
            any::googlesheets4

      - name: Render website
        run: quarto render

      - name: Save rendered website
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: _site/
          if-no-files-found: error
          retention-days: 7
